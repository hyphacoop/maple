name: Repo Checks

on: ["push", "pull_request"]

jobs:
  check_python_quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r llm/requirements.txt
      - run: ruff check llm/
      - run: ruff format --check llm/
      - run: pytest llm/

  check_code_quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup-repo

      - name: Linting
        if: always()
        run: yarn lint

      - name: Formatting
        if: always()
        run: yarn check-formatting

      # TODO: Fix non-functions unit tests
      - name: Unit Tests
        if: always()
        run: yarn test

      - name: Types
        if: always()
        run: yarn check-types

  check_atproto_identity:
    name: Identity Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      # A standalone node-22 ESM package the root tsconfig excludes, so it
      # installs and runs on its own rather than through setup-repo. No
      # emulator here -- it talks to a PLC directory, not Firestore.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
        working-directory: services/atproto-identity
      - run: yarn typecheck
        working-directory: services/atproto-identity
      # Operation construction, the plan diff and every safety rail, with no
      # network.
      - name: Identity Tests
        run: yarn test
        working-directory: services/atproto-identity

  check_atproto_consumer:
    name: Consumer Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      # The consumer is a standalone node-22 ESM package excluded from the
      # root tsconfig, so root check-types can't see it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
        working-directory: services/atproto-consumer
      - run: yarn typecheck
        working-directory: services/atproto-consumer
      # Generated lexicon types are committed, so a lexicon edited without a
      # regen would otherwise ship types that describe the old schema.
      - name: Lexicon Codegen Is Current
        # --porcelain, not `git diff`: a newly added lexicon generates untracked
        # files, which a diff would not see.
        run: |
          yarn codegen
          if [ -n "$(git status --porcelain -- src/lexicons)" ]; then
            git status --short -- src/lexicons
            echo "::error::lexicons/ changed without re-running 'yarn codegen'"
            exit 1
          fi
        working-directory: services/atproto-consumer
      - name: Lexicon Documents And Fixtures
        run: yarn validate
        working-directory: services/atproto-consumer
      - name: Cache Emulators
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/firebase/emulators
          # ft14 tracks the firebase-tools@14 that the consumer's test:emulated
          # script fetches via npx; bump both together.
          key: ${{ runner.os }}-firebase-emulators-ft14
      - name: Consumer Tests
        run: yarn test:emulated
        working-directory: services/atproto-consumer

  check_atproto_publisher:
    name: Publisher Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      # Same reason as Consumer Checks: a standalone node-22 ESM package that
      # the root tsconfig excludes, so root check-types cannot see it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
        working-directory: services/atproto-publisher
      - run: yarn typecheck
        working-directory: services/atproto-publisher
      # Both atproto packages generate from the same lexicons/*.json. The JSON
      # is the shared artifact; the generated TypeScript is a build output each
      # package commits, so each needs its own drift check.
      - name: Lexicon Codegen Is Current
        run: |
          yarn codegen
          if [ -n "$(git status --porcelain -- src/lexicons)" ]; then
            git status --short -- src/lexicons
            echo "::error::lexicons/ changed without re-running 'yarn codegen'"
            exit 1
          fi
        working-directory: services/atproto-publisher
      # Catches a lexicon added without anywhere to publish it from, which is
      # otherwise silent: the record type simply never gets written.
      - name: Every Lexicon Has A Publisher Target
        run: yarn validate
        working-directory: services/atproto-publisher
      - name: Cache Emulators
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/firebase/emulators
          # ft15 tracks the firebase-tools@15 this package's test:emulated
          # fetches. Deliberately the same major as the deploy action pin in
          # deploy-backend-dev.yml, since that is what actually deploys this
          # codebase; the consumer's ft14 is independent.
          key: ${{ runner.os }}-firebase-emulators-ft15
      - name: Publisher Tests
        run: yarn test:emulated
        working-directory: services/atproto-publisher

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check_code_quality

    services:
      typesense:
        # Keep in sync with infra/Dockerfile.search
        image: typesense/typesense:30.2
        ports:
          - 8108:8108
        env:
          TYPESENSE_DATA_DIR: /app/data
          TYPESENSE_API_KEY: test-api-key
          TYPESENSE_ENABLE_CORS: "true"
        volumes:
          - typesense-data:/app/data

    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup-repo
      - name: Cache Emulators
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('~/.cache/firebase/emulators/**') }}
      - name: Smoke Test Firebase Admin CLI
        run: >
          ./node_modules/.bin/firebase --project demo-dtp emulators:exec
          --only auth,firestore
          --import tests/integration/exportedTestData
          "yarn firebase-admin run-script backfillTestimonyBallotQuestionId --env local"

      - name: Run Integration Tests
        run: >
          yarn test:integration-ci
          tests/integration/testimony.test.ts
          tests/integration/auth.test.ts
          tests/integration/moderation.test.ts
          tests/integration/profile.test.ts
          tests/integration/ballotQuestions.test.ts
          tests/integration/backfillTestimonyBallotQuestionId.test.ts

name: ATProto Harness

# The only job that exercises the real wire path, in both directions:
#
#   read   a record put on a real PDS, carried by a real relay and a real
#          jetstream into the consumer and on into Firestore
#   write  a scraped Firestore document published by services/atproto-publisher,
#          all the way back round to Firestore -- plus the assertion no unit test
#          can make, that a re-scrape moving only fetchedAt commits NOTHING
#
# Everything else in CI tests logic in isolation, so a PDS_IMAGE bump that broke
# record acceptance would otherwise merge green.
#
# Both halves in ONE job, though the publish half insists on its own Firestore
# and functions emulators (firebase.atproto-e2e.json: 8081/5011 -- the functions
# emulator only fires triggers against a Firestore emulator it started itself).
# The emulators cannot be shared; the compose stack underneath them can, and
# bringing that up is most of the runtime, since a cold run pays a full PLC image
# build from a pinned git ref. One bootstrap, one build, both assertions.
#
# Its own workflow rather than a job in repo-checks.yml because that workflow is
# ungated (`on: ["push", "pull_request"]`) and GitHub has no per-job path
# filter; this stack is far too expensive to run on every frontend change.
on:
  pull_request:
    paths:
      - services/atproto-consumer/**
      - services/atproto-publisher/**
      - services/atproto-identity/**
      - infra/atproto/**
      - infra/identity/**
      - lexicons/**
      - firebase.atproto-e2e.json
      - .github/workflows/atproto-harness.yml
  push:
    branches:
      - main
    paths:
      - services/atproto-consumer/**
      - services/atproto-publisher/**
      - services/atproto-identity/**
      - infra/atproto/**
      - infra/identity/**
      - lexicons/**
      - firebase.atproto-e2e.json
      - .github/workflows/atproto-harness.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness_smoke:
    name: Harness Smoke (read + publish)
    runs-on: ubuntu-latest
    # Cold runs pay a full PLC image build from a pinned git ref (compose.yml
    # builds it; there is no published image), and the two halves run in
    # sequence, so the budget is generous relative to what this should take.
    # Publishing that image is the obvious saving; measure first.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      # Same reason as repo-checks.yml's atproto jobs: a standalone node-22 ESM
      # package with its own lockfile, excluded from the root tsconfig.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Not .github/actions/setup-repo: that installs the ROOT lockfile.
          # Each package has its own, so the cache keys on all three.
          cache: yarn
          cache-dependency-path: |
            services/atproto-consumer/yarn.lock
            services/atproto-publisher/yarn.lock
            services/atproto-identity/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: services/atproto-consumer
      - run: yarn install --frozen-lockfile
        working-directory: services/atproto-publisher
      # bootstrap.sh mints the DID before it creates the account, so the
      # identity tooling has to be installed before the stack comes up.
      - run: yarn install --frozen-lockfile
        working-directory: services/atproto-identity

      - name: Cache Emulators
        uses: actions/cache@v4
        with:
          # The emulator JARs, and the npx cache that fetches firebase-tools
          # itself. Without the second, both `yarn emulator` and
          # publish-check.sh re-resolve the whole firebase-tools tree from
          # the registry on every run; the consumer's is backgrounded into
          # bootstrap's minutes, but publish-check.sh's is not covered by
          # anything and would be paid serially at the end of the job.
          path: |
            /home/runner/.cache/firebase/emulators
            ~/.npm/_npx
          # One cache, two firebase-tools majors: the consumer's `emulator`
          # script fetches 14, publish-check.sh fetches 15 (the same major as
          # the deploy action that ships this codebase). Three pins move
          # together -- those two and repo-checks.yml's Publisher Checks.
          key: ${{ runner.os }}-firebase-emulators-ft14-ft15

      # Started BEFORE bootstrap, and waited on after: it needs nothing from the
      # stack, so its npx download and JVM boot hide inside bootstrap's minutes
      # instead of being paid on top of them.
      - name: Start The Firestore Emulator
        run: nohup yarn emulator > "$RUNNER_TEMP/emulator.log" 2>&1 &
        working-directory: services/atproto-consumer

      # Brings up plc/pds/relay/jetstream on compose healthchecks, registers the
      # PDS with the relay, and creates the harness account. Bounded waits
      # throughout, so a hang fails rather than idles.
      - name: Bootstrap The Stack
        run: infra/atproto/bootstrap.sh

      # Genesis, createAccount with the pre-minted DID, the signing-key rotation
      # and the activation borrow are all exercised by bootstrap.sh above -- it
      # runs the production sequence, so the runbook in infra/gcp/README.md
      # cannot drift from something that is actually tested. What is left is the
      # custody behaviour that only a real PLC can demonstrate: drift detection,
      # the recovery-key nullification ADR 0002 §5 asks to be rehearsed, and the
      # proof that the PDS's own rotation key is neither in the document nor
      # able to sign for it.
      #
      # Before the consumer starts: these scenarios rewrite the DID document
      # several times and a consumer running alongside would be resolving an
      # identity that moves under it.
      - name: Identity Scenarios
        run: infra/atproto/identity-check.sh

      # MUST be running before the record is written: with no stored cursor the
      # consumer starts from the live tip, so anything put before this point is
      # published into a window nobody is listening to.
      #
      # lib.sh is sourced rather than restated: it owns the endpoint values, the
      # wait loops and the readiness pattern, so CI cannot drift from what
      # bootstrap.sh and recovery.sh use.
      - name: Start The Consumer
        run: |
          . infra/atproto/lib.sh
          load_state DID
          wait_for firestore "http://$FIRESTORE_EMULATOR_HOST/" 90 \
            || { cat "$RUNNER_TEMP/emulator.log"; fail "the emulator never came up"; }
          # Job control, so the consumer gets a process group of its own and
          # the step that stops it can take the whole tree -- see
          # stop_consumer_group in lib.sh.
          set -m
          MAPLE_DIDS="$DID" nohup yarn --cwd services/atproto-consumer dev \
            > "$RUNNER_TEMP/consumer.log" 2>&1 &
          # Steps are separate shells, so the pid (= the pgid, given `set -m`)
          # has to be written down for the step that stops it again.
          echo $! > "$RUNNER_TEMP/consumer.pid"
          set +m
          wait_for_consumer "$RUNNER_TEMP/consumer.log" 60 "$(cat "$RUNNER_TEMP/consumer.pid")" \
            || { cat "$RUNNER_TEMP/consumer.log"; fail "the consumer never reached the jetstream tail"; }

      # The read half's assertion. Identical to what a developer runs against a
      # local stack.
      - name: Smoke Test
        run: yarn test:smoke
        working-directory: services/atproto-consumer

      # publish-check.sh runs a consumer of its own, against its own emulator.
      # Two consumers tailing the same jetstream write to two different
      # emulators, so this is not a correctness problem -- but the next step
      # asserts that certain writes did NOT happen, and a second writer alive
      # during that is what turns a failure into an afternoon.
      - name: Stop The Consumer
        run: |
          . infra/atproto/lib.sh
          stop_consumer_group "$(cat "$RUNNER_TEMP/consumer.pid")"

      # The write half, and the same command a developer runs locally. It brings
      # up its own Firestore + functions emulators on 8081/5011 and its own
      # consumer, and reuses the compose stack bootstrap.sh already started.
      - name: Publish Loop Check
        run: infra/atproto/publish-check.sh
        env:
          E2E_CONSUMER_LOG: ${{ runner.temp }}/publish-consumer.log

      - name: Collect Logs
        if: failure()
        run: |
          . infra/atproto/lib.sh
          dc logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1 || true
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
